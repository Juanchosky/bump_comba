# ============================================================================
#  Proxy con caché para Xtream — Contabo Cloud VPS 4 (4 vCPU / 8 GB / 100 GB)
#  Archivo: /etc/nginx/conf.d/vod.conf
# ============================================================================

proxy_cache_path /var/cache/vod    levels=1:2 keys_zone=vod:200m
                 max_size=60g inactive=30d use_temp_path=off;
proxy_cache_path /var/cache/vodapi levels=1:2 keys_zone=vodapi:20m
                 max_size=2g  inactive=1h  use_temp_path=off;
proxy_cache_path /var/cache/img    levels=1:2 keys_zone=img:50m
                 max_size=10g inactive=60d use_temp_path=off;

upstream proveedor {
    server red4tv.lat:80;
    keepalive 16;
}

upstream origen_imagenes {
    server ultratvsv.site:80;
    keepalive 32;
}

map $arg_url $uri_de_imagen {
    default                          "";
    "~*^https?://[^/]+(?<ruta>/.*)$" $ruta;
}

# ---------------------------------------------------------------------------
# CAPA 2 (interna, 127.0.0.1:8081) — resuelve el redirect 302 del proveedor.
#
# Va separada A PROPÓSITO: el módulo `slice` trabaja con subpeticiones
# internas, y en ese contexto la cabecera Location del 302 NO se propaga a la
# named location -> $upstream_http_location llega vacío y nginx responde 500
# ("invalid URL prefix"). Aquí, sin slice de por medio, el patrón funciona.
# ---------------------------------------------------------------------------
server {
    listen 127.0.0.1:8081;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host red4tv.lat;
        proxy_set_header Range $http_range;

        proxy_pass http://proveedor;

        proxy_intercept_errors on;
        error_page 301 302 307 = @redir;
    }

    location @redir {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $saved_location $upstream_http_location;
        proxy_http_version 1.1;
        proxy_set_header Range $http_range;
        proxy_pass $saved_location;
    }
}

# ---------------------------------------------------------------------------
# CAPA 1 (pública, puerto 80) — Video, API, Catálogo y Carátulas
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;

    proxy_max_temp_file_size 0;
    # Los servidores IPTV suelen mandar cabeceras anti-cache que impedirían
    # guardar nada; se ignoran a propósito.
    proxy_ignore_headers Cache-Control Expires Set-Cookie X-Accel-Expires;

    # ── 1) CATÁLOGO (player_api.php fallback) ──────────────────────────────
    location = /player_api.php {
        proxy_cache            vodapi;
        proxy_cache_key        "$request_uri";
        proxy_cache_valid      200 10m;
        proxy_cache_lock       on;
        proxy_cache_use_stale  error timeout updating;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host red4tv.lat;
        proxy_pass http://proveedor;

        add_header X-Cache $upstream_cache_status always;
    }

    # ── 2) CATÁLOGO PRE-HORNEADO ───────────────────────────────────────────
    # Archivos estáticos generados por /usr/local/bin/catalogo.sh
    location /catalogo/ {
        alias /var/www/catalogo/;

        gzip_static on;
        gzip off;

        add_header Cache-Control "public, max-age=600, must-revalidate" always;
        default_type application/json;
        charset utf-8;

        try_files $uri =404;
    }

    # ── 3) HLS para Chromecast ─────────────────────────────────────────────
    #
    # ESTE BLOQUE TIENE QUE IR ANTES QUE EL 4). No es orden estetico.
    #
    # nginx evalua las `location` con regex EN ORDEN DE APARICION y se queda con
    # la primera que casa. El regex del bloque 4 termina en `(?<item>.+)$`, asi
    # que tambien casa con `.../algo.m3u8`. Si alguien sube el 4) o borra este
    # bloque, las playlists HLS se irian por el camino del video: `slice 1m`
    # partiendo en trozos de 1 MB un archivo de texto de 2 KB, y cacheando 30
    # dias una lista que caduca en segundos. El Chromecast dejaria de reproducir
    # con un fallo dificil de rastrear, porque los dos bloques "funcionan".
    #
    # Por eso este cachea solo 10s (una playlist en vivo cambia todo el tiempo)
    # y va sin slice.
    location ~ ^/(movie|series|live)/[^/]+/[^/]+/.+\.m3u8$ {
        proxy_cache              vodapi;
        proxy_cache_key          "$uri$is_args$args";
        proxy_cache_valid        200 10s;
        proxy_cache_lock         on;
        proxy_cache_lock_timeout 5s;

        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_pass         http://127.0.0.1:8081;

        add_header X-Cache $upstream_cache_status always;
    }

    # ── 4) VIDEO (películas y series con slice 1m) ─────────────────────────
    #
    # Va DESPUES del 3) a proposito: su regex tambien casaria con los `.m3u8`.
    # Leer la nota del bloque anterior antes de reordenar nada.
    #
    # `slice` obliga a apuntar a la CAPA 2 (127.0.0.1:8081) y no al proveedor:
    # en las subpeticiones que genera `slice` la cabecera Location del 302 no
    # llega, y seguir el redirect desde aqui da HTTP 500. Ver la nota de la
    # CAPA 2 arriba: es el fallo que tumbo toda la reproduccion el 2026-08-22 y
    # que `nginx -t` no detecta.
    location ~ ^/(?<tipo>movie|series)/(?<usuario>[^/]+)/(?<clave>[^/]+)/(?<item>.+)$ {
        slice 1m;
        proxy_set_header Range $slice_range;

        proxy_buffer_size 64k;
        proxy_buffers     20 64k;

        proxy_cache              vod;
        proxy_cache_key          "$tipo/$item$slice_range";
        proxy_cache_valid        206 30d;
        proxy_cache_lock         on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_use_stale    error timeout updating;

        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:8081;

        add_header X-Cache $upstream_cache_status always;
    }

    # ── 5) Carátulas por ruta directa /images/... ──────────────────────────
    location /images/ {
        proxy_ignore_client_abort on;

        proxy_cache               img;
        proxy_cache_key           "$uri";
        proxy_cache_valid         200 60d;
        proxy_cache_valid         404 403 1m;
        proxy_cache_valid         any 1m;
        proxy_cache_lock          on;
        proxy_cache_lock_timeout  10s;
        proxy_cache_use_stale     error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_revalidate    on;
        proxy_ignore_headers      Cache-Control Expires Set-Cookie X-Accel-Expires;
        proxy_connect_timeout     4s;
        proxy_read_timeout        8s;
        proxy_send_timeout        4s;
        proxy_http_version        1.1;
        proxy_set_header          Connection "";
        proxy_set_header          Host ultratvsv.site;
        proxy_set_header          User-Agent "Mozilla/5.0 (Linux; Android 13)";
        proxy_pass                http://origen_imagenes;
        add_header                Cache-Control "public, max-age=2592000" always;
        add_header                X-Cache $upstream_cache_status always;
    }

    # ── 6) Carátulas por parámetro /img?url=<url> ──────────────────────────
    location = /img {
        if ($arg_url = "") { return 400; }

        proxy_ignore_client_abort on;

        proxy_cache               img;
        proxy_cache_key           "$arg_url";
        proxy_cache_valid         200 60d;
        proxy_cache_valid         404 403 1m;
        proxy_cache_valid         any 1m;
        proxy_cache_lock          on;
        proxy_cache_lock_timeout  10s;
        proxy_cache_use_stale     error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_revalidate    on;
        proxy_ignore_headers      Cache-Control Expires Set-Cookie X-Accel-Expires;
        proxy_connect_timeout     4s;
        proxy_read_timeout        8s;
        proxy_send_timeout        4s;
        proxy_http_version        1.1;
        proxy_set_header          Connection "";
        proxy_set_header          Host ultratvsv.site;
        proxy_set_header          User-Agent "Mozilla/5.0 (Linux; Android 13)";
        proxy_pass                http://origen_imagenes$uri_de_imagen;
        add_header                Cache-Control "public, max-age=2592000" always;
        add_header                X-Cache $upstream_cache_status always;
    }
}
