# ============================================================================
#  Proxy con caché para Xtream — Contabo Cloud VPS 4 (4 vCPU / 8 GB / 100 GB)
#  Archivo: /etc/nginx/conf.d/vod.conf
# ============================================================================
#
#  QUÉ RESUELVE
#  ------------
#  La línea del proveedor tiene un tope de conexiones simultáneas
#  (max_connections). Ese tope se reparte entre TODOS los usuarios de la app,
#  así que se satura enseguida. Con esta caché:
#
#    · N usuarios viendo algo ya cacheado   → 0 conexiones al proveedor
#    · N usuarios pidiendo lo mismo a la vez → 1 conexión (proxy_cache_lock)
#    · Las conexiones contratadas quedan libres para lo que falte en caché
#
#  CÓMO FUNCIONA EL PROVEEDOR (verificado con curl)
#  ------------------------------------------------
#    1) Se pide la URL canónica:  /movie/USUARIO/CLAVE/759711.mkv
#    2) El proveedor responde 302 → http://130.78.216.218/vauth/<token largo>
#    3) Ese destino SÍ respeta Range y devuelve 206  ← clave para el `slice`
#
#  nginx NO sigue redirects dentro de proxy_pass. Por eso está el bloque
#  @sigue_redirect: intercepta el 302 y va al destino real DESDE EL VPS.
#  Esto además arregla el token: lo emite el proveedor para la IP del VPS y lo
#  consume el VPS, así que nunca hay desajuste de IP (que es lo que rompía el
#  intento anterior, donde el 302 se le reenviaba al celular).
#
# ============================================================================

# ── Almacén de caché ────────────────────────────────────────────────────────
# max_size=80g deja ~20 GB libres del disco de 100 GB para el sistema.
# Con `slice` sólo se guarda lo que la gente REALMENTE mira, así que en la
# práctica vas a tener los primeros minutos de cientos de títulos en vez de
# 50 películas completas. Se auto-optimiza según lo que se ve.
proxy_cache_path /var/cache/vod
                 levels=1:2
                 keys_zone=vod:200m
                 max_size=80g
                 inactive=30d
                 use_temp_path=off;

# Caché aparte para el catálogo (JSON). Es chico y cambia más seguido.
proxy_cache_path /var/cache/vodapi
                 levels=1:2
                 keys_zone=vodapi:20m
                 max_size=2g
                 inactive=1h
                 use_temp_path=off;

upstream proveedor {
    server red4tv.lat:80;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Sin límite: los archivos de video son grandes.
    proxy_max_temp_file_size 0;
    proxy_buffering on;

    # ── 1) CATÁLOGO (player_api.php) ────────────────────────────────────────
    # Hoy CADA arranque de app le pide el catálogo entero al proveedor
    # (25.000+ películas). Cachearlo 10 minutos le saca muchísima carga y casi
    # no consume tráfico, porque es JSON.
    location = /player_api.php {
        proxy_cache            vodapi;
        proxy_cache_key        "$request_uri";
        proxy_cache_valid      200 10m;
        proxy_cache_lock       on;
        proxy_cache_use_stale  error timeout updating;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host red4tv.lat;
        proxy_pass http://proveedor;

        add_header X-Cache $upstream_cache_status always;
    }

    # ── 2) VIDEO (películas y series) ───────────────────────────────────────
    # Se capturan usuario/clave por separado para NO meterlos en la clave de
    # caché: así el caché sobrevive a un cambio de contraseña y se comparte
    # entre varias líneas del proveedor.
    location ~ ^/(?<tipo>movie|series)/(?<usuario>[^/]+)/(?<clave>[^/]+)/(?<item>.+)$ {

        # Trozos de 1 MB. Es lo que permite responder 206 correctamente y
        # cachear sólo la parte del archivo que se mira.
        slice 1m;
        proxy_set_header Range $slice_range;

        proxy_cache            vod;
        proxy_cache_key        "$tipo/$item$slice_range";
        proxy_cache_valid      200 206 30d;

        # CLAVE con pocas conexiones: si 50 usuarios piden el mismo trozo a la
        # vez, sale UNA sola petición al proveedor y los demás esperan.
        proxy_cache_lock          on;
        proxy_cache_lock_timeout  30s;
        proxy_cache_use_stale     error timeout updating;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host red4tv.lat;

        proxy_pass http://proveedor;

        # El proveedor contesta 302 → hay que seguirlo del lado del servidor.
        proxy_intercept_errors on;
        error_page 301 302 307 = @sigue_redirect;

        # HIT / MISS / EXPIRED — sirve para medir si la caché rinde.
        add_header X-Cache $upstream_cache_status always;
    }

    # ── 3) Seguir el 302 hacia /vauth/<token> ───────────────────────────────
    location @sigue_redirect {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

        proxy_set_header Range $slice_range;
        proxy_http_version 1.1;

        # MISMA clave que arriba: así el contenido queda cacheado bajo la URL
        # canónica y no bajo el token (que cambia en cada petición).
        proxy_cache            vod;
        proxy_cache_key        "$tipo/$item$slice_range";
        proxy_cache_valid      200 206 30d;
        proxy_cache_lock       on;
        proxy_cache_lock_timeout 30s;

        proxy_pass $upstream_http_location;

        add_header X-Cache $upstream_cache_status always;
    }
}
