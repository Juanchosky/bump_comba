# ============================================================================
#  Proxy con caché para Xtream — Contabo Cloud VPS 4 (4 vCPU / 8 GB / 100 GB)
#  Archivo: /etc/nginx/conf.d/vod.conf
# ============================================================================

proxy_cache_path /var/cache/vod    levels=1:2 keys_zone=vod:200m
                 max_size=60g inactive=30d use_temp_path=off;
proxy_cache_path /var/cache/vodapi levels=1:2 keys_zone=vodapi:20m
                 max_size=2g  inactive=1h  use_temp_path=off;
proxy_cache_path /var/cache/img    levels=1:2 keys_zone=img:50m
                 max_size=10g inactive=60d use_temp_path=off;

upstream proveedor {
    server red4tv.lat:80;
    keepalive 16;
}

upstream origen_imagenes {
    server ultratvsv.site:80;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# CARRILES POR TIPO DE USUARIO
#
# El techo de la app es el puerto del VPS (200 Mbit/s = ~25 MB/s), no el disco.
# Cuando el puerto se satura, nginx no lee del origen a tiempo, la peticion se
# alarga y el proveedor la corta (`upstream prematurely closed connection`):
# ese es el origen de la mayoria de los cortes de reproduccion.
#
# Hasta ahora free y premium competian por el mismo ancho. Un free en rafaga a
# 40 Mbps le quita el puerto a un premium que paga. Aqui se separan en dos
# carriles segun la cabecera `X-Bump-Tier` que manda la app:
#
#   p  -> premium
#   f  -> free (o cualquier cliente que no mande la cabecera)
#
# NO es seguridad, es reparto de ancho: la cabecera se puede falsificar. Solo
# hace falta que el cliente honesto se auto-clasifique bien. Si algun dia hace
# falta que sea infalsificable, hay que firmarla (HMAC con la clave de la app).
#
# Los topes van MUY por encima de lo que necesita un stream (un 1080p de este
# proveedor va a 5-6 Mbps), asi que nadie nota el limite reproduciendo: lo que
# se corta es la RAFAGA de precarga, que es la que satura el puerto. Y el
# `limit_rate_after` deja los primeros MB a toda velocidad, que es justo el
# arranque — la parte donde la espera se nota.
# ---------------------------------------------------------------------------
# OJO CON EL DEFAULT: es el carril PREMIUM, no el free.
#
# Parece al reves y es a proposito. Solo estrangula a quien se declara free
# ("f"); cualquier cliente que no mande la cabecera pasa por el carril bueno.
#
# Si el default fuera el free, el dia que se aplica esta config al VPS —antes
# de que la version nueva de la app llegue a las tiendas— TODOS los usuarios,
# premium incluidos, quedarian estrangulados a 8 Mbps, porque ninguna app en
# la calle manda todavia `X-Bump-Tier`. Y este proveedor sirve peliculas que
# piden 8.0 Mbps: seria dejar a todo el mundo justo en el limite.
#
# Asi el cambio es inocuo hasta que la app nueva empiece a identificarse, y a
# partir de ahi el reparto aparece solo, sin ventana de castigo.
map $http_x_bump_tier $tope_video {
    default   "2500k";   # premium y todo lo que no se identifique: ~20 Mbps
    "f"       "1000k";   # free declarado: ~8 Mbps sostenidos
}

map $http_x_bump_tier $arranque_libre {
    default   "24m";     # premium: los primeros 24 MB sin tope
    "f"       "8m";      # free: los primeros 8 MB sin tope
}

# ── POR QUE NO HAY `limit_conn` ────────────────────────────────────────────
#
# Habia un `limit_conn video_por_ip 4`. Esta MAL por dos razones:
#
# 1) TurboProxy (el acelerador de la app) abre varias conexiones en paralelo
#    contra el origen para un SOLO stream: escala a 3 y despues a 4 piernas, y
#    el techo del codigo es 8 (`_parallelCeiling`, configurable desde Supabase
#    con `turbo_max_parallel`). Con el limite en 4, la reproduccion normal de
#    un unico usuario ya se comia la cuota y las piernas de mas recibian 503.
#
# 2) `$binary_remote_addr` es la IP PUBLICA. Detras del CGNAT de un movil
#    pueden compartirla docenas de usuarios sin ninguna relacion entre si: el
#    limite lo agota el primero y los demas comen 503 sin haber hecho nada.
#
# Un 503 a un usuario legitimo es mucho peor que un abusador llevandose ancho
# de banda, y para el abusador ya esta el `limit_rate`. Si algun dia hace falta
# reactivarlo, tiene que ser >= 16 (8 piernas x 2 dispositivos) y sabiendo que
# el CGNAT lo comparte.

map $arg_url $uri_de_imagen {
    default                          "";
    "~*^https?://[^/]+(?<ruta>/.*)$" $ruta;
}

# ---------------------------------------------------------------------------
# CAPA 2 (interna, 127.0.0.1:8081) — resuelve el redirect 302 del proveedor.
#
# Va separada A PROPÓSITO: el módulo `slice` trabaja con subpeticiones
# internas, y en ese contexto la cabecera Location del 302 NO se propaga a la
# named location -> $upstream_http_location llega vacío y nginx responde 500
# ("invalid URL prefix"). Aquí, sin slice de por medio, el patrón funciona.
# ---------------------------------------------------------------------------
server {
    listen 127.0.0.1:8081;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host red4tv.lat;
        proxy_set_header Range $http_range;

        proxy_pass http://proveedor;

        proxy_intercept_errors on;
        error_page 301 302 307 = @redir;
    }

    location @redir {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $saved_location $upstream_http_location;
        proxy_http_version 1.1;
        proxy_set_header Range $http_range;
        proxy_pass $saved_location;
    }
}

# ---------------------------------------------------------------------------
# CAPA 1 (pública, puerto 80) — Video, API, Catálogo y Carátulas
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;

    proxy_max_temp_file_size 0;
    # Los servidores IPTV suelen mandar cabeceras anti-cache que impedirían
    # guardar nada; se ignoran a propósito.
    proxy_ignore_headers Cache-Control Expires Set-Cookie X-Accel-Expires;

    # ── 1) CATÁLOGO (player_api.php fallback) ──────────────────────────────
    location = /player_api.php {
        proxy_cache            vodapi;
        proxy_cache_key        "$request_uri";
        proxy_cache_valid      200 10m;
        proxy_cache_lock       on;
        proxy_cache_use_stale  error timeout updating;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host red4tv.lat;
        proxy_pass http://proveedor;

        add_header X-Cache $upstream_cache_status always;
    }

    # ── 2) CATÁLOGO PRE-HORNEADO ───────────────────────────────────────────
    # Archivos estáticos generados por /usr/local/bin/catalogo.sh
    location /catalogo/ {
        alias /var/www/catalogo/;

        gzip_static on;
        gzip off;

        add_header Cache-Control "public, max-age=600, must-revalidate" always;
        default_type application/json;
        charset utf-8;

        try_files $uri =404;
    }

    # ── 3) HLS para Chromecast ─────────────────────────────────────────────
    #
    # ESTE BLOQUE TIENE QUE IR ANTES QUE EL 4). No es orden estetico.
    #
    # nginx evalua las `location` con regex EN ORDEN DE APARICION y se queda con
    # la primera que casa. El regex del bloque 4 termina en `(?<item>.+)$`, asi
    # que tambien casa con `.../algo.m3u8`. Si alguien sube el 4) o borra este
    # bloque, las playlists HLS se irian por el camino del video: `slice 1m`
    # partiendo en trozos de 1 MB un archivo de texto de 2 KB, y cacheando 30
    # dias una lista que caduca en segundos. El Chromecast dejaria de reproducir
    # con un fallo dificil de rastrear, porque los dos bloques "funcionan".
    #
    # Por eso este cachea solo 10s (una playlist en vivo cambia todo el tiempo)
    # y va sin slice.
    location ~ ^/(movie|series|live)/[^/]+/[^/]+/.+\.m3u8$ {
        proxy_cache              vodapi;
        proxy_cache_key          "$uri$is_args$args";
        proxy_cache_valid        200 10s;
        proxy_cache_lock         on;
        proxy_cache_lock_timeout 5s;

        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_pass         http://127.0.0.1:8081;

        add_header X-Cache $upstream_cache_status always;
    }

    # ── 4) VIDEO (películas y series con slice 1m) ─────────────────────────
    #
    # Va DESPUES del 3) a proposito: su regex tambien casaria con los `.m3u8`.
    # Leer la nota del bloque anterior antes de reordenar nada.
    #
    # `slice` obliga a apuntar a la CAPA 2 (127.0.0.1:8081) y no al proveedor:
    # en las subpeticiones que genera `slice` la cabecera Location del 302 no
    # llega, y seguir el redirect desde aqui da HTTP 500. Ver la nota de la
    # CAPA 2 arriba: es el fallo que tumbo toda la reproduccion el 2026-08-22 y
    # que `nginx -t` no detecta.
    location ~ ^/(?<tipo>movie|series)/(?<usuario>[^/]+)/(?<clave>[^/]+)/(?<item>.+)$ {
        # Carril segun tier (ver los `map` de arriba). Son solo dos directivas
        # con variable dentro del bloque que ya existia: no anade `location`
        # ni `if` nuevos, asi que no toca la combinacion slice + redirect que
        # da el HTTP 500 que `nginx -t` no detecta.
        # (limit_rate / limit_rate_after aceptan variables desde nginx 1.17.)
        # OJO: `limit_rate` es POR CONEXION, no por cliente. TurboProxy abre
        # hasta 4 piernas en paralelo para un mismo stream, asi que el tope
        # real que ve un usuario free es ~4 x 8 = 32 Mbps, no 8. Los valores
        # estan elegidos con eso en cuenta: lo que se corta es la rafaga de
        # una pierna, y el conjunto sigue teniendo aire para reproducir.
        # Si alguna vez hace falta un tope duro POR USUARIO, `limit_rate` no
        # es la herramienta — habria que contar por sesion en la capa de app.
        limit_rate       $tope_video;
        limit_rate_after $arranque_libre;

        slice 1m;
        proxy_set_header Range $slice_range;

        proxy_buffer_size 64k;
        proxy_buffers     20 64k;

        proxy_cache              vod;
        proxy_cache_key          "$tipo/$item$slice_range";
        proxy_cache_valid        206 30d;
        proxy_cache_lock         on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_use_stale    error timeout updating;

        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:8081;

        add_header X-Cache $upstream_cache_status always;
    }

    # ── 5) Carátulas por ruta directa /images/... ──────────────────────────
    location /images/ {
        proxy_ignore_client_abort on;

        proxy_cache               img;
        proxy_cache_key           "$uri";
        proxy_cache_valid         200 60d;
        proxy_cache_valid         404 403 1m;
        proxy_cache_valid         any 1m;
        proxy_cache_lock          on;
        proxy_cache_lock_timeout  10s;
        proxy_cache_use_stale     error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_revalidate    on;
        proxy_ignore_headers      Cache-Control Expires Set-Cookie X-Accel-Expires;
        proxy_connect_timeout     4s;
        proxy_read_timeout        8s;
        proxy_send_timeout        4s;
        proxy_http_version        1.1;
        proxy_set_header          Connection "";
        proxy_set_header          Host ultratvsv.site;
        proxy_set_header          User-Agent "Mozilla/5.0 (Linux; Android 13)";
        proxy_pass                http://origen_imagenes;
        add_header                Cache-Control "public, max-age=2592000" always;
        add_header                X-Cache $upstream_cache_status always;
    }

    # ── 6) Carátulas por parámetro /img?url=<url> ──────────────────────────
    location = /img {
        if ($arg_url = "") { return 400; }

        proxy_ignore_client_abort on;

        proxy_cache               img;
        proxy_cache_key           "$arg_url";
        proxy_cache_valid         200 60d;
        proxy_cache_valid         404 403 1m;
        proxy_cache_valid         any 1m;
        proxy_cache_lock          on;
        proxy_cache_lock_timeout  10s;
        proxy_cache_use_stale     error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_revalidate    on;
        proxy_ignore_headers      Cache-Control Expires Set-Cookie X-Accel-Expires;
        proxy_connect_timeout     4s;
        proxy_read_timeout        8s;
        proxy_send_timeout        4s;
        proxy_http_version        1.1;
        proxy_set_header          Connection "";
        proxy_set_header          Host ultratvsv.site;
        proxy_set_header          User-Agent "Mozilla/5.0 (Linux; Android 13)";
        proxy_pass                http://origen_imagenes$uri_de_imagen;
        add_header                Cache-Control "public, max-age=2592000" always;
        add_header                X-Cache $upstream_cache_status always;
    }
}
